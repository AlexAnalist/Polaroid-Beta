{% extends 'base.html' %}
{% block content %}
<style>
  .register-card {
    --card-bg: #ffffff;       
    --card-header-bg: #6366f1; 
    --card-text: #1e293b;    
    --card-border: #e2e8f0;   
    --btn-primary: #6366f1;   
    --btn-hover: #4f46e5;     
    --link-color: #6366f1;    
  }

  .register-card {
    background-color: var(--card-bg);
    border: 1px solid var(--card-border);
    color: var(--card-text);
  }

  .register-card .card-header {
    background-color: var(--card-header-bg);
  }

  .register-card .btn-primary {
    background-color: var(--btn-primary);
    border-color: var(--btn-primary);
  }

  .register-card .btn-primary:hover {
    background-color: var(--btn-hover);
    border-color: var(--btn-hover);
  }

  .register-card a {
    color: var(--link-color);
  }
</style>

<div class="container">
  <div class="row justify-content-center">
    <div class="col-md-6 col-lg-5">
      <div class="card shadow-lg border-0 rounded-lg mt-5 register-card">
        <div class="card-header text-white">
          <h3 class="text-center font-weight-light my-4">Iniciar sesión</h3>
        </div>
        <div class="card-body">
          <form action="{{url_for('login')}}" method="POST" novalidate>
            <div class="form-floating mb-3">
              <input type="text" class="form-control" id="username" name="username" 
              value="{{request.form.username if request.method == 'POST'}}" placeholder="Usuario o Email" required>
              <label for="username">Usuario o Email</label>
             </div>
           <div class="form-floating mb-3">
              <input type="password" class="form-control" id="password" name="password" placeholder="Contraseña">
              <label for="password">Contraseña</label>
              <div class="invalid-feedback">
                La contraseña debe tener al menos 8 caracteres
              </div>
           </div>
           <div class="d-grid gap-2">
             <button type="submit" class="btn btn-primary btn-lg">
                <i class="bi bi-person-plus me-2"></i>Ingresar
              </button>
            </div>
          </form>
        </div>
        <div class="card-footer text-center py-3">
          <div class="small">
            <a href="{{url_for('register')}}" class="text-decoration-none">¿No tienes cuenta? Regístrate</a>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
